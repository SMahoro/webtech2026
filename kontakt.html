<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LadeSpot.de - Kontakt</title>
        <link href="styles.css" rel="stylesheet">
        <script src="auth.js"></script>
    </head>
    <body>
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="index.html">LadeSpot.de</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Startseite</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login/Registration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Kontakt</a>
                    </li>
                    <li class="nav-item logout-form">
                        <button class="btn nav-link" type="submit" id="logout-button" onclick="logout(event)">Abmelden</button>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Hauptinhalt -->
        <div id="kontakt" class="container content active">
            <h1>Kontakt</h1>
            <p>Haben Sie Fragen? Kontaktieren Sie uns!</p>
            <form>
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" class="form-control" id="name" placeholder="Name eingeben">
                </div>
                <div class="form-group">
                    <label for="email">E-Mail-Adresse:</label>
                    <input type="email" class="form-control" id="email" placeholder="E-Mail eingeben">
                </div>
                <div class="form-group">
                    <label for="message">Nachricht:</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Ihre Nachricht"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Nachricht senden</button>
            </form>
        </div>
   
        <!-- Footer -->
        <footer>
            <div class="container p-4">
                <div class="text-center">
                    <a href="impressum.html" id="openImpressum" class="text-dark">Impressum</a> |
                    <a href="datenschutz.html" id="openDatenschutz" class="text-dark">Datenschutz</a>
                </div>
            </div>
        </footer>

    </body>
    <script>
        const logoutBtn = document.getElementById("logout-button");

        if (!Auth.isLoggedIn()) {
            logoutBtn.classList.add("display-none");
        }

        // Navigations-Collapse 
        document.querySelectorAll('[data-toggle="collapse"]').forEach(
            function (btn) {
                btn.addEventListener('click', function () {
                    const target = document.querySelector(this.getAttribute('data-target'));
                     if (target) target.classList.toggle('show');
                });
            }
        );
    </script>
</html>
