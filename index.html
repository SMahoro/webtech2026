<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>LadeSpot.de - Startseite</title>
        <link href="styles.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
        <link rel="stylesheet" href="map.css">
        <script type="importmap">{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"}}</script>
        <script src="auth.js"></script>
        <script type="module" src="map.js"></script>
    </head>
    <body>
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <a class="navbar-brand" href="#">LadeSpot.de</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="index.html">Startseite</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login/Registration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="kontakt.html">Kontakt</a>
                    </li>
                    <li class="nav-item logout-form">
                        <button class="btn nav-link" type="submit" id="logout-button" onclick="logout(event)">Abmelden</button>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Inhalt -->
        <div id="startseite" class="container content active">
            <h1>LadeSpot.de</h1>
            <p>Willkommen bei LadeSpot.de! Finden Sie Ihre nächste Ladestation:</p>
            
            <div id="mapContents"> 
                <div id="map"></div>
            </div>

            <h3 id="loginAd">Legen Sie ein Konto bei uns an und speichern sie ihre Favoriten ab!</h3>
        </div>


        <!-- Footer -->
        <footer>
            <div class="container p-4">
                <div class="text-center">
                    <a href="impressum.html" id="openImpressum" class="text-dark">Impressum</a> |
                    <a href="datenschutz.html" id="openDatenschutz" class="text-dark">Datenschutz</a>
                </div>
            </div>
        </footer>

        <script>
            const logoutBtn = document.getElementById("logout-button");

            if(!Auth.isLoggedIn()){
                logoutBtn.classList.add("display-none");
            }

            // Navigations-Collapse 
            document.querySelectorAll('[data-toggle="collapse"]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const target = document.querySelector(this.getAttribute('data-target'));
                    if (target) target.classList.toggle('show');
                });
            });
            
        </script>
    </body>
</html>
