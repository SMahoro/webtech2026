    <!-- Login/Register Inhalt -->
    <div id="login" class="container content active">
        <h1>Login oder Registrierung</h1>
        <form>
            <div class="form-group">
                <label for="email">E-Mail-Adresse:</label>
                <input type="email" class="form-control" id="email" placeholder="E-Mail eingeben" required>
            </div>
            <div class="form-group">
                <label for="password">Passwort:</label>
                <input type="password" class="form-control" id="password" placeholder="Passwort eingeben" required>
            </div>
            <div class="form-group">
                <span id="login-error-box" class="display-none">Bitte prüfen Sie Ihre E-Mail und Ihr Passwort</span>
            </div>
            <button type="submit" class="btn btn-primary" onclick="login(event)">Einloggen</button>
            <a href="#" class="btn btn-secondary">Registrieren</a>
        </form>
    </div>

    <!-- Footer -->


    <!-- Footer -->
<footer>

            <a href="impressum.html" id="openImpressum" class="text-dark">Impressum</a> |
            <a href="datenschutz.html" id="openDatenschutz" class="text-dark">Datenschutz</a>
        </div>
    </div>
</footer>

    <script defer>
        const TEST_USER = "testuser@test.de";
        const TEST_PASSWORD = "12345";
        let isLoggedIn = false;

        const usernameInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginErrorBox = document.getElementById("login-error-box");

        function login(e) {
            e.preventDefault();

            const enteredName = usernameInput.value.trim();
            const enteredPassword = passwordInput.value.trim();
            if (enteredName == TEST_USER && enteredPassword == TEST_PASSWORD) {
                isLoggedIn = true;
                loginErrorBox.classList.add("display-none");
            } else {
                loginErrorBox.classList.remove("display-none");
            }
            sessionStorage.setItem("isLoggedIn", isLoggedIn);
        }

        function showContent(id) {
            document.querySelectorAll('.content').forEach(function(element) {
                element.classList.remove('active');
            });
            document.getElementById(id).classList.add('active');
        }

        // Ersatz für Bootstrap Collapse (Navigation)
        document.querySelectorAll('[data-toggle="collapse"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const target = document.querySelector(this.getAttribute('data-target'));
                if (target) target.classList.toggle('show');
            });
        });

        // Ersatz für Bootstrap Modals
        document.querySelectorAll('[data-toggle="modal"]').forEach(function(trigger) {
            trigger.addEventListener('click', function(e) {
                e.preventDefault();
                const modal = document.querySelector(this.getAttribute('data-target'));
                if (modal) {
                    modal.style.display = 'block';
                    setTimeout(() => modal.classList.add('show'), 10);
                }
            });
        });

        document.querySelectorAll('[data-dismiss="modal"]').forEach(function(btn) {
            btn.addEventListener('click', function() {
                const modal = this.closest('.modal');
                if (modal) {
                    modal.classList.remove('show');
                    setTimeout(() => modal.style.display = 'none', 150);
                }
            });
        });
    </script>
</body>
